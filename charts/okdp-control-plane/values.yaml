# Default values for okdp-control-plane.
#
# The chart is an umbrella over the two published control-plane charts:
#   - okdp-control-plane-server (oci://quay.io/okdp/charts/okdp-control-plane-server)
#   - okdp-control-plane-ui     (oci://quay.io/okdp/charts/okdp-control-plane-ui)
# Every key under `okdp-control-plane-server:` / `okdp-control-plane-ui:` is
# passed verbatim to the corresponding sub-chart. Only the most common settings
# are listed here; any value supported by the sub-charts can be set under these
# keys.
#
# The defaults target no particular platform. `values-dev-sandbox.yaml` holds
# the values for the OKDP dev sandbox.

# -- Values passed to the okdp-control-plane-server sub-chart.
okdp-control-plane-server:
  # -- Deploy the API server.
  enabled: true
  image:
    repository: quay.io/okdp/images/okdp-control-plane-server
    # -- Image tag. Empty means the sub-chart appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  # Rendered as environment variables of the server.
  configuration:
    # -- Namespace hosting the platform components.
    platformNamespace: okdp-system
    # -- Namespace of the KuboCD controller.
    kubocdNamespace: kubocd-system
    # -- Single origin allowed by CORS on the API. The console itself is
    # same-origin, so this only matters for callers on another origin; set it to
    # `https://<okdp-control-plane-ui.ingress.host>` when it does.
    allowedOrigins: https://okdp-ui.example.com
    logLevel: info
  service:
    type: ClusterIP
    port: 8093
  resources: {}

# -- Values passed to the okdp-control-plane-ui sub-chart.
okdp-control-plane-ui:
  # -- Deploy the web console.
  enabled: true
  image:
    repository: quay.io/okdp/images/okdp-control-plane-ui
    # -- Image tag. Empty means the sub-chart appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  # In-cluster okdp-server Service the console ingress routes /api to.
  backend:
    # -- Name of the Service the console ingress routes /api to. The umbrella
    # chart renders a Service with this name in front of the API server pods, so
    # it does not depend on the release name.
    service: okdp-server
    # -- Port of that Service.
    port: 8093
  # OIDC provider of the console, injected at container startup (config.js).
  oidc:
    # -- Issuer URL of the OIDC provider the console authenticates against.
    # Required: the sub-chart fails the render when it is empty. The chart does
    # not assume any particular provider.
    authority: ""
    # -- Client id the console uses. The client must exist in the provider,
    # with the console URL as an allowed redirect URI.
    clientId: okdp-ui
  service:
    type: ClusterIP
    port: 4200
  # Public exposure of the console.
  ingress:
    className: nginx
    # -- Public host of the console.
    host: okdp-ui.example.com
    # -- cert-manager ClusterIssuer used for the TLS certificate.
    clusterIssuer: default-issuer
    tlsSecretName: okdp-ui-tls
  resources: {}

# Optional registration of the console as an OIDC client, for platforms whose
# provider is kubauth: it renders an `OidcClient` resource with the console URL
# as an allowed redirect URI. Off by default, since it needs the kubauth CRD on
# the cluster and the chart does not assume any provider. With any other
# provider, register the client there and leave this disabled.
oidcClient:
  # -- Render the kubauth OidcClient for the console.
  enabled: false
  # -- Name of the OidcClient resource. kubauth uses it as client_id, so it must
  # match `okdp-control-plane-ui.oidc.clientId`.
  name: okdp-ui
  # -- Namespace of the OidcClient. Defaults to
  # okdp-control-plane-server.configuration.platformNamespace.
  namespace: ""
  # -- Public URL of the console. Defaults to
  # `https://<okdp-control-plane-ui.ingress.host>`.
  publicUrl: ""
  displayName: OKDP Console
  description: OIDC client for the OKDP web console
  # -- Additional allowed redirect URIs (e.g. http://localhost:4200 to develop
  # the console against this cluster).
  extraRedirectURIs: []
  accessTokenLifespan: 1h0m0s
  idTokenLifespan: 1h0m0s
  refreshTokenLifespan: 1h0m0s
  scopes:
    - openid
    - profile
    - email
    - groups
    - offline_access
  # -- Extra labels added to the OidcClient.
  labels: {}
  # -- Extra annotations added to the OidcClient.
  annotations: {}

tests:
  # -- Image used by the `helm test` connection check.
  image: busybox:1.37
