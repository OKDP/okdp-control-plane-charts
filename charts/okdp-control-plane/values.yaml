# Default values for okdp-control-plane.
#
# The chart is an umbrella over the two published control-plane charts:
#   - okdp-control-plane-server (oci://quay.io/okdp/charts/okdp-control-plane-server)
#   - okdp-control-plane-ui     (oci://quay.io/okdp/charts/okdp-control-plane-ui)
# Every key under `okdp-control-plane-server:` / `okdp-control-plane-ui:` is
# passed verbatim to the corresponding sub-chart. Only the most common settings
# are listed here; any value supported by the sub-charts can be set under these
# keys.

# -- Values passed to the okdp-control-plane-server sub-chart.
okdp-control-plane-server:
  # -- Deploy the API server.
  enabled: true
  image:
    repository: quay.io/okdp/images/okdp-control-plane-server
    # -- Image tag. Empty means the sub-chart appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  # Rendered as environment variables of the server.
  configuration:
    # -- Namespace hosting the platform components (kubauth, OIDC clients).
    platformNamespace: okdp-system
    # -- Namespace of the KuboCD controller.
    kubocdNamespace: kubocd-system
    # -- KuboCD Context holding the service catalog. The dev-sandbox uses
    # `default` in `kubocd-system` (the sub-chart default is `platform` in the
    # release namespace).
    contextName: default
    contextNamespace: kubocd-system
    # -- Single origin allowed by CORS. Kept for direct API access; the console
    # itself is same-origin (the ingress routes /api to the server).
    allowedOrigins: https://console.okdp.dev-sandbox
    logLevel: info
    releaseInterval: 30m
    releaseTimeout: 10m
  service:
    type: ClusterIP
    port: 8093
  resources: {}

# -- Values passed to the okdp-control-plane-ui sub-chart.
okdp-control-plane-ui:
  # -- Deploy the web console.
  enabled: true
  image:
    repository: quay.io/okdp/images/okdp-control-plane-ui
    # -- Image tag. Empty means the sub-chart appVersion.
    tag: ""
    pullPolicy: IfNotPresent
  # In-cluster okdp-server Service the console ingress routes /api to.
  backend:
    # -- Name of the Service the console ingress routes /api to. The umbrella
    # chart renders a Service with this name in front of the API server pods,
    # so it does not depend on the release name.
    service: okdp-server
    # -- Port of that Service.
    port: 8093
  # OIDC provider of the console, injected at container startup (config.js).
  oidc:
    # -- OIDC issuer the console authenticates against. Required by the
    # sub-chart.
    authority: https://kubauth.okdp.dev-sandbox
    # -- OIDC client id. Must match `oidcClient.name` below.
    clientId: okdp-ui
  identity:
    # -- ID-token claim carrying the caller's roles.
    rolesClaim: groups
    # -- Role (in the claim above) that opens the administration pages. The
    # dev-sandbox admin user carries the `admins` group (the sub-chart default
    # is `platform_admin`).
    adminRole: admins
  service:
    type: ClusterIP
    port: 4200
  # Public exposure of the console.
  ingress:
    className: nginx
    # -- Public host of the console.
    host: console.okdp.dev-sandbox
    # -- cert-manager ClusterIssuer used for the TLS certificate.
    clusterIssuer: default-issuer
    tlsSecretName: okdp-ui-tls
  resources: {}

# Kubauth OIDC client for the console. The console authenticates with the
# platform OIDC provider (kubauth) using `okdp-control-plane-ui.oidc.clientId`;
# this resource registers that client with the console public URL as an allowed
# redirect URI. Requires the kubauth CRDs (oidcclients.kubauth.kubotal.io) on
# the cluster.
oidcClient:
  # -- Create the kubauth OidcClient for the console.
  enabled: true
  # -- Name of the OidcClient resource. Kubauth uses it as client_id, which
  # must match `okdp-control-plane-ui.oidc.clientId`.
  name: okdp-ui
  # -- Namespace of the OidcClient (kubauth clients namespace). Defaults to
  # okdp-control-plane-server.configuration.platformNamespace.
  namespace: ""
  # -- Public URL of the console. Defaults to
  # `https://<okdp-control-plane-ui.ingress.host>`.
  publicUrl: ""
  displayName: OKDP Console
  description: OIDC client for the OKDP web console
  # -- Additional allowed redirect URIs (e.g. http://localhost:4200 for local
  # development of the console against this cluster).
  extraRedirectURIs: []
  accessTokenLifespan: 1h0m0s
  idTokenLifespan: 1h0m0s
  refreshTokenLifespan: 1h0m0s
  scopes:
    - openid
    - profile
    - email
    - groups
    - offline_access
  # -- Extra labels added to the OidcClient.
  labels: {}
  # -- Extra annotations added to the OidcClient.
  annotations: {}

tests:
  # -- Image used by the `helm test` connection check.
  image: busybox:1.37
