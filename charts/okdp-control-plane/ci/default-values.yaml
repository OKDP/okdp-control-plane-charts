# Values used by chart-testing (`ct install`) on a bare Kind cluster, which has
# no OIDC provider, no ingress controller and no cert-manager.
okdp-control-plane-ui:
  oidc:
    # The console sub-chart requires an issuer URL; none is reachable here.
    authority: https://oidc.ci.invalid
oidcClient:
  # Pinned rather than inherited: the OidcClient needs the kubauth CRD, which a
  # bare cluster does not carry.
  enabled: false
