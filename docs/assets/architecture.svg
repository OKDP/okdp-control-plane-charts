<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 440" width="1400" height="440" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ah" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7.5" markerHeight="7.5" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#111111"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1400" height="440" fill="#ffffff"/>

  <!-- ===== Helm release boundary (what this chart installs) ===== -->
  <rect x="400" y="40" width="780" height="330" rx="8" fill="none" stroke="#555555" stroke-width="1.4" stroke-dasharray="7,5"/>
  <text x="416" y="64" font-size="13" fill="#555555">Helm release okdp-control-plane (this chart)</text>

  <!-- ===== edges ===== -->
  <g fill="none" stroke="#111111" stroke-width="1.4" marker-end="url(#ah)">
    <line x1="140"  y1="281" x2="181"  y2="281"/>
    <line x1="365"  y1="281" x2="426"  y2="281"/>
    <line x1="630"  y1="287" x2="686"  y2="287"/>
    <line x1="860"  y1="287" x2="916"  y2="287"/>
    <line x1="1150" y1="270" x2="1216" y2="184"/>
    <line x1="1150" y1="304" x2="1216" y2="374"/>
    <line x1="430"  y1="123" x2="344"  y2="123"/>
    <line x1="80"   y1="250" x2="200"  y2="158"/>
  </g>

  <!-- ===== edge labels (white halo so they never sit on a line) ===== -->
  <g font-size="11.5" fill="#222222" text-anchor="middle" paint-order="stroke" stroke="#ffffff" stroke-width="3.5" stroke-linejoin="round">
    <text x="160"  y="273">HTTPS</text>
    <text x="658"  y="279">/api</text>
    <text x="1183" y="222">read / write</text>
    <text x="1183" y="335">catalog</text>
    <text x="1183" y="349">+ Releases</text>
    <text x="387"  y="116">redirect URIs</text>
    <text x="128"  y="197">OIDC login</text>
  </g>

  <!-- ===== boxes ===== -->
  <g fill="#ffffff" stroke="#111111">
    <rect x="20"   y="250" width="120" height="62" rx="6" stroke-width="1.4"/>
    <rect x="185"  y="246" width="180" height="70" rx="6" stroke-width="1.4"/>
    <rect x="150"  y="88"  width="190" height="68" rx="6" stroke-width="1.4"/>
    <rect x="430"  y="90"  width="200" height="66" rx="6" stroke-width="1.4"/>
    <rect x="430"  y="246" width="200" height="82" rx="6" stroke-width="1.4"/>
    <rect x="690"  y="254" width="170" height="66" rx="6" stroke-width="1.4"/>
    <rect x="920"  y="246" width="230" height="82" rx="6" stroke-width="2.6"/>
    <rect x="1220" y="150" width="160" height="68" rx="6" stroke-width="1.4"/>
    <rect x="1220" y="340" width="160" height="68" rx="6" stroke-width="1.4"/>
  </g>

  <!-- ===== box titles ===== -->
  <g font-size="15" fill="#111111" text-anchor="middle">
    <text x="80"   y="278">User</text>
    <text x="275"  y="278">Ingress</text>
    <text x="245"  y="119">kubauth</text>
    <text x="530"  y="120">OidcClient okdp-ui</text>
    <text x="530"  y="282">OKDP Console</text>
    <text x="775"  y="284">Service okdp-server</text>
    <text x="1035" y="282" font-size="16" font-weight="bold">Control Plane Server</text>
    <text x="1300" y="181">Kubernetes API</text>
    <text x="1300" y="371">KuboCD</text>
  </g>

  <!-- ===== box explanations (parentheses) ===== -->
  <g font-size="11.5" fill="#555555" text-anchor="middle">
    <text x="80"   y="296">(browser)</text>
    <text x="275"  y="296">(nginx, TLS by cert-manager)</text>
    <text x="245"  y="137">(platform OIDC provider)</text>
    <text x="530"  y="138">(this chart)</text>
    <text x="530"  y="302">(ui sub-chart)</text>
    <text x="775"  y="302">(this chart, stable name)</text>
    <text x="1035" y="302">(server sub-chart)</text>
    <text x="1300" y="199">(cluster control plane)</text>
    <text x="1300" y="389">(GitOps engine)</text>
  </g>
</svg>
