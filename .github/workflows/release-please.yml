name: release-please

on:
  pull_request:
    types:
      - closed
    branches:
      - main

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

# https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  # Only cancel in-progress jobs or runs for the current workflow - matches against branch & tags
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      github_releases: ${{ steps.github-releases.outputs.result }}
    # The pull request should come from the same repo (github_token from a fork does not have write permissions)
    if: github.event.pull_request.merged == true && github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: googleapis/release-please-action@v4
        id: release-please
      
      - uses: actions/github-script@v7
        id: github-releases
        with:
          script: |
            const pathsReleased = JSON.parse(JSON.stringify(${{ steps.release-please.outputs.paths_released }}))
            const releasesOutput = JSON.parse(JSON.stringify(${{ toJSON(steps.release-please.outputs) }}))
            const githubReleases = []

            for (const path of pathsReleased) {
              const chartName = path.replace(/^charts\//, '')
              githubReleases.push({
                path,
                chart_name: chartName,
                version: releasesOutput[`${path}--version`] || releasesOutput.version,
                tag_name: releasesOutput[`${path}--tag_name`] || releasesOutput.tag_name
              })
            }

            return githubReleases

  publish:
    runs-on: ubuntu-latest
    needs: [release-please]
    if: needs.release-please.outputs.github_releases != '' && needs.release-please.outputs.github_releases != '[]'
    steps:
      - name: Build and publish charts to public registry
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ github.token }}
          GH_DEBUG: api
        run: gh workflow run publish.yml --ref main
        shell: bash
      
