name: ci 

on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"

      - ".ct.yml"
      - ".ct-install.yml"
      - ".lintconf.yaml"

      - "**/**"
  
      - "!README.md"
      - "!**/README.md"
      - "!docs/**"

  push:
    branches:
      - '**'
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"

      - ".ct.yml"
      - ".ct-install.yml"
      - ".lintconf.yaml"

      - "**/**"

      - "!README.md"
      - "!**/README.md"
      - "!docs/**"

  workflow_dispatch:
  
permissions:
  packages: write
  contents: write

# https://docs.github.com/en/actions/using-jobs/using-concurrency
concurrency:
  # Only cancel in-progress jobs or runs for the current workflow - matches against branch & tags
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  helm-charts-lint:
    name: helm-lint
    uses: ./.github/workflows/helm-lint-template.yml
    with:
      skip_chart_test: false
    secrets: inherit

  helm-charts-publish-ci:
    name: helm-publish-ci
    needs: [helm-charts-lint]
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Setup helm
        uses: azure/setup-helm@v5
        with:
          version: v3.15.1

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and push Helm charts to GHCR
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          oci_repository="oci://ghcr.io/$owner/charts"
          mkdir -p .helm-packages

          mapfile -t charts < <(find charts -mindepth 2 -maxdepth 2 -name Chart.yaml -print | sort)
          if [ "${#charts[@]}" -eq 0 ]; then
            echo "No Helm charts found in charts/"
            exit 1
          fi

          for chart_yaml in "${charts[@]}"; do
            chart="$(dirname "$chart_yaml")"
            version="$(helm show chart "$chart" | awk -F ': *' '$1 == "version" {print $2; exit}')"
            ci_version="${version}-ci.${GITHUB_RUN_NUMBER}.${GITHUB_SHA::7}"

            echo "Packaging $chart as $ci_version"
            helm dependency build "$chart"
            helm package "$chart" --version "$ci_version" --destination .helm-packages
          done

          for package in .helm-packages/*.tgz; do
            echo "Pushing $package to $oci_repository"
            helm push "$package" "$oci_repository"
          done
